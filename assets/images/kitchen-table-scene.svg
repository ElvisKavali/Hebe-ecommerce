<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid meet">
  <defs>
    <linearGradient id="woodGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#d4a574"/>
      <stop offset="100%" style="stop-color:#8b6f47"/>
    </linearGradient>
    <style>
      .plate-l { animation: wobbleL 6s ease-in-out infinite; transform-origin: 200px 350px; }
      .plate-r { animation: wobbleR 5.5s ease-in-out infinite; transform-origin: 600px 350px; }
      .knife-l { animation: swayL 7s ease-in-out infinite; transform-origin: 180px 280px; }
      .knife-r { animation: swayR 6.5s ease-in-out infinite; transform-origin: 620px 340px; }
      .spoon-l { animation: danceL 5s ease-in-out infinite; transform-origin: 280px 320px; }
      .spoon-r { animation: danceR 5.5s ease-in-out infinite; transform-origin: 520px 340px; }
      .cup { animation: bounce 4.5s ease-in-out infinite; transform-origin: 350px 300px; }
      .bowl { animation: swirl 6.5s ease-in-out infinite; transform-origin: 450px 320px; }
      .blender { animation: tilt 5s ease-in-out infinite; transform-origin: 400px 200px; }
      
      @keyframes wobbleL { 0%,100% { transform: rotate(3deg); } 50% { transform: rotate(-3deg) translateY(-4px); } }
      @keyframes wobbleR { 0%,100% { transform: rotate(-3deg); } 50% { transform: rotate(3deg) translateY(-5px); } }
      @keyframes swayL { 0%,100% { transform: rotate(-30deg) translateX(0); } 50% { transform: rotate(-25deg) translateX(5px); } }
      @keyframes swayR { 0%,100% { transform: rotate(30deg) translateX(0); } 50% { transform: rotate(27deg) translateX(-5px); } }
      @keyframes danceL { 0%,100% { transform: translateY(0) scaleX(1); } 50% { transform: translateY(-6px) scaleX(1.06); } }
      @keyframes danceR { 0%,100% { transform: translateY(0) scaleX(1); } 50% { transform: translateY(-7px) scaleX(1.04); } }
      @keyframes bounce { 0%,100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-8px) rotate(3deg); } }
      @keyframes swirl { 0%,100% { transform: rotate(0deg) scale(1); } 50% { transform: rotate(12deg) scale(1.05); } }
      @keyframes tilt { 0%,100% { transform: rotate(0deg) translateY(0); } 50% { transform: rotate(4deg) translateY(-5px); } }
    </style>
  </defs>
  
  <!-- Wood table -->
  <ellipse cx="400" cy="380" rx="380" ry="90" fill="url(#woodGrad)"/>
  <ellipse cx="400" cy="370" rx="380" ry="80" fill="#b8956a" opacity="0.3"/>
  <ellipse cx="400" cy="420" rx="350" ry="40" fill="#000" opacity="0.15"/>
  
  <!-- Plate Left -->
  <g class="plate-l">
    <circle cx="200" cy="350" r="50" fill="#f5f5dc" stroke="#d4af37" stroke-width="3" opacity="1"/>
    <circle cx="200" cy="350" r="40" fill="none" stroke="#e8dcc0" stroke-width="2" opacity="0.8"/>
  </g>
  
  <!-- Plate Right -->
  <g class="plate-r">
    <circle cx="600" cy="350" r="50" fill="#f5f5dc" stroke="#d4af37" stroke-width="3" opacity="1"/>
    <circle cx="600" cy="350" r="40" fill="none" stroke="#e8dcc0" stroke-width="2" opacity="0.8"/>
  </g>
  
  <!-- Knife Left -->
  <g class="knife-l" transform="translate(180, 280) rotate(-30)">
    <rect x="0" y="0" width="8" height="100" fill="#c0c0c0" rx="4"/>
    <polygon points="0,-8 4,-20 8,-8" fill="#8b4513"/>
    <rect x="1" y="85" width="6" height="20" fill="#8b4513"/>
  </g>
  
  <!-- Knife Right -->
  <g class="knife-r" transform="translate(620, 340) rotate(30)">
    <rect x="0" y="0" width="8" height="100" fill="#c0c0c0" rx="4"/>
    <polygon points="0,-8 4,-20 8,-8" fill="#8b4513"/>
    <rect x="1" y="85" width="6" height="20" fill="#8b4513"/>
  </g>
  
  <!-- Spoon Left -->
  <g class="spoon-l" transform="translate(280, 320)">
    <rect x="0" y="0" width="6" height="80" fill="#b0b0b0" rx="3"/>
    <ellipse cx="3" cy="-20" rx="16" ry="22" fill="#d4d4d4" stroke="#808080" stroke-width="1"/>
  </g>
  
  <!-- Spoon Right -->
  <g class="spoon-r" transform="translate(520, 340)">
    <rect x="0" y="0" width="6" height="80" fill="#b0b0b0" rx="3"/>
    <ellipse cx="3" cy="-22" rx="18" ry="24" fill="#d4d4d4" stroke="#808080" stroke-width="1"/>
  </g>
  
  <!-- Stanley Cup -->
  <g class="cup">
    <g transform="translate(350, 300)">
      <rect x="-22" y="0" width="44" height="60" fill="#1a472a" rx="3"/>
      <rect x="-24" y="2" width="48" height="10" fill="#228B22" rx="2"/>
      <circle cx="20" cy="30" r="5" fill="#fff" opacity="0.4"/>
      <rect x="-20" y="55" width="40" height="10" fill="#164d1f" rx="2"/>
    </g>
  </g>
  
  <!-- Bowl -->
  <g class="bowl">
    <g transform="translate(450, 320)">
      <ellipse cx="0" cy="0" rx="40" ry="32" fill="#d32f2f" opacity="0.95"/>
      <ellipse cx="0" cy="-6" rx="36" ry="28" fill="#b71c1c" opacity="0.8"/>
      <ellipse cx="0" cy="-10" rx="32" ry="24" fill="#e64a4a" opacity="0.6"/>
    </g>
  </g>
  
  <!-- Blender -->
  <g class="blender">
    <g transform="translate(400, 200)">
      <!-- Base -->
      <rect x="-20" y="0" width="40" height="14" fill="#333" rx="2"/>
      <!-- Pitcher -->
      <rect x="-26" y="14" width="52" height="65" fill="#e8e8e8" rx="4" stroke="#333" stroke-width="2"/>
      <!-- Blades base -->
      <ellipse cx="0" cy="79" rx="28" ry="10" fill="#999" stroke="#333" stroke-width="1.5"/>
      <!-- Control buttons -->
      <circle cx="-10" cy="18" r="4" fill="#555"/>
      <circle cx="0" cy="18" r="4" fill="#555"/>
      <circle cx="10" cy="18" r="4" fill="#555"/>
    </g>
  </g>
  
  <!-- Fork -->
  <g transform="translate(320, 280) rotate(-20)">
    <rect x="0" y="0" width="4" height="75" fill="#b0b0b0" rx="2"/>
    <g transform="translate(0, -22)">
      <rect x="-12" y="0" width="3" height="22" fill="#b0b0b0"/>
      <rect x="-4" y="0" width="3" height="22" fill="#b0b0b0"/>
      <rect x="4" y="0" width="3" height="22" fill="#b0b0b0"/>
      <rect x="12" y="0" width="3" height="22" fill="#b0b0b0"/>
    </g>
  </g>
  
  <!-- Cup accent -->
  <g transform="translate(550, 280)">
    <rect x="-16" y="0" width="32" height="45" fill="#fff" stroke="#d4af37" stroke-width="2" rx="4"/>
    <circle cx="20" cy="18" r="6" fill="none" stroke="#d4af37" stroke-width="2"/>
  </g>
</svg>